[project]
name = "privacy-auth-backend"
version = "0.1.0"
description = "Privacy-preserving campus delivery authentication backend"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "sqlalchemy>=2.0.32",
  "aiosqlite>=0.20.0",
  "alembic>=1.13.2",
  "pydantic>=2.8.2",
  "pydantic-settings>=2.4.0",
  "python-jose[cryptography]>=3.3.0",
  "passlib[bcrypt]>=1.7.4",
  "structlog>=24.4.0",
  "python-multipart>=0.0.9",
  "httpx>=0.27.0",
  "greenlet>=3.0.3"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.2",
  "pytest-asyncio>=0.24.0",
  "coverage>=7.6.1",
  "ruff>=0.6.2",
  "black>=24.8.0",
]
crypto = [
  "charm-crypto"
]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
